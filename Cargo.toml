[package]
name = "vitaforge"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Homebrew catalog browser for games/apps/ports on the PS Vita"
[dependencies]
aes = { version = "0.8", default-features = false }
anyhow = "1"
ctr = { version = "0.9", default-features = false }
egui = "0.31"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
md-5 = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
sdl2 = { version = "0.38", features = ["use-pkgconfig", "unsafe_textures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
fluent-bundle = "0.16.0"
unic-langid = "0.9.6"
rusqlite = { version = "0.32", features = ["bundled"] }
# Console-only. Every use site is already behind `cfg(target_os = "vita")`;
# keeping the crates themselves off the host build means the pure-logic unit
# tests (catalog parsing, text sanitizing, rate-limit handling) can be linked
# and run with plain `cargo test` on a dev machine.
[target.'cfg(target_os = "vita")'.dependencies]
vita-newlib-shims = "0.3"
vitasdk-sys = { version = "0.3", features = ["SceAppUtil_stub", "SceSysmem_stub", "SceSysmodule_stub", "ScePromoterUtil_stub", "SceKernelThreadMgr_stub", "SceIme_stub", "SceCommonDialog_stub", "SceLibKernel_stub", "SceIofilemgr_stub", "SceNotificationUtil_stub", "ScePower_stub", "SceGxm_stub", "SceDisplay_stub", "SceCtrl_stub", "SceTouch_stub", "SceAudio_stub"] }
[build-dependencies]
cc = "1.0"
[patch.crates-io]
# vanilla `ring` doesn't build for this target: it finds no libc RNG source it
ring = { git = "https://github.com/vita-rust/ring.git", branch = "v0.17.14-vita" }
[package.metadata.vita]
title_id = "VITAFORGE"
title_name = "VitaForge"
assets = "static"
vita_make_fself_flags = []
[profile.release]
lto = "fat"
codegen-units = 1
